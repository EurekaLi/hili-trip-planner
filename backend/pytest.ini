[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: Fast tests for isolated domain and service logic without process or network dependencies.
    contract: Stable schemas and adapter contracts between agents, providers, and progress events.
    integration: API, SQL, Redis, and service-boundary collaboration tests.
    system: End-to-end backend workflows using deterministic local substitutes and datasets.
    resilience: Explicit dependency, broker, timeout, and worker failure tests.
    phase6: Reserved release-gate tests added during production deployment work.
